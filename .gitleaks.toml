title = "Cafe secret scan"
[extend]
useDefault = true

[[rules]]
id = "cafe-secret-key"
description = "Explicit secret_key assignment with a complete hexadecimal secret"
regex = '''(?i)secret_key\s*[:=]\s*["']?([a-f0-9]{64})(?:["']|\s|$)'''
secretGroup = 1
keywords = ["secret_key"]

[allowlist]
regexTarget = "line"
# Whole canonical receipt lines only: extensible maps of repository paths/digests.
# The node builder separately validates tracked existence and actual content hashes.
# Root names constrain values, never exempt a scanned directory or file.
# Pinned scanner line targets can include one preceding newline separator.
regexes = [
    '''^\n?SCHEMA_SHA256 = "[a-f0-9]{64}"$''',
    '''^\n?\{"corpus":"cafe","families":\{(?:"[a-z0-9][a-z0-9-]{0,26}":"(?:(?:core|connectors|src|router|catalogue|subjects|docs|tests|tools|\.github)/(?:(?:[A-Za-z0-9_][A-Za-z0-9_.-]*|\.[A-Za-z0-9_][A-Za-z0-9_.-]*)/)*(?:[A-Za-z0-9_][A-Za-z0-9_.-]*|\.[A-Za-z0-9_][A-Za-z0-9_.-]*)|(?:[A-Za-z0-9_][A-Za-z0-9_.-]*\.[A-Za-z0-9_-]+|\.gitattributes|\.gitignore|\.gitleaks\.toml|LICENSE))"(?:,"[a-z0-9][a-z0-9-]{0,26}":"(?:(?:core|connectors|src|router|catalogue|subjects|docs|tests|tools|\.github)/(?:(?:[A-Za-z0-9_][A-Za-z0-9_.-]*|\.[A-Za-z0-9_][A-Za-z0-9_.-]*)/)*(?:[A-Za-z0-9_][A-Za-z0-9_.-]*|\.[A-Za-z0-9_][A-Za-z0-9_.-]*)|(?:[A-Za-z0-9_][A-Za-z0-9_.-]*\.[A-Za-z0-9_-]+|\.gitattributes|\.gitignore|\.gitleaks\.toml|LICENSE))")*)?\},"metadata":\{(?:"(?:(?:core|connectors|src|router|catalogue|subjects|docs|tests|tools|\.github)/(?:(?:[A-Za-z0-9_][A-Za-z0-9_.-]*|\.[A-Za-z0-9_][A-Za-z0-9_.-]*)/)*(?:[A-Za-z0-9_][A-Za-z0-9_.-]*|\.[A-Za-z0-9_][A-Za-z0-9_.-]*)|(?:[A-Za-z0-9_][A-Za-z0-9_.-]*\.[A-Za-z0-9_-]+|\.gitattributes|\.gitignore|\.gitleaks\.toml|LICENSE))":"[a-fA-F0-9]{64}"(?:,"(?:(?:core|connectors|src|router|catalogue|subjects|docs|tests|tools|\.github)/(?:(?:[A-Za-z0-9_][A-Za-z0-9_.-]*|\.[A-Za-z0-9_][A-Za-z0-9_.-]*)/)*(?:[A-Za-z0-9_][A-Za-z0-9_.-]*|\.[A-Za-z0-9_][A-Za-z0-9_.-]*)|(?:[A-Za-z0-9_][A-Za-z0-9_.-]*\.[A-Za-z0-9_-]+|\.gitattributes|\.gitignore|\.gitleaks\.toml|LICENSE))":"[a-fA-F0-9]{64}")*)?\},"node_schema_sha256":"[a-fA-F0-9]{64}","profile_sha256":"[a-fA-F0-9]{64}","schema":"cafe\.router-sources\.v1","sources":\{(?:"(?:(?:core|connectors|src|router|catalogue|subjects|docs|tests|tools|\.github)/(?:(?:[A-Za-z0-9_][A-Za-z0-9_.-]*|\.[A-Za-z0-9_][A-Za-z0-9_.-]*)/)*(?:[A-Za-z0-9_][A-Za-z0-9_.-]*|\.[A-Za-z0-9_][A-Za-z0-9_.-]*)|(?:[A-Za-z0-9_][A-Za-z0-9_.-]*\.[A-Za-z0-9_-]+|\.gitattributes|\.gitignore|\.gitleaks\.toml|LICENSE))":"[a-fA-F0-9]{64}"(?:,"(?:(?:core|connectors|src|router|catalogue|subjects|docs|tests|tools|\.github)/(?:(?:[A-Za-z0-9_][A-Za-z0-9_.-]*|\.[A-Za-z0-9_][A-Za-z0-9_.-]*)/)*(?:[A-Za-z0-9_][A-Za-z0-9_.-]*|\.[A-Za-z0-9_][A-Za-z0-9_.-]*)|(?:[A-Za-z0-9_][A-Za-z0-9_.-]*\.[A-Za-z0-9_-]+|\.gitattributes|\.gitignore|\.gitleaks\.toml|LICENSE))":"[a-fA-F0-9]{64}")*)?\},"tools":\{(?:"(?:(?:core|connectors|src|router|catalogue|subjects|docs|tests|tools|\.github)/(?:(?:[A-Za-z0-9_][A-Za-z0-9_.-]*|\.[A-Za-z0-9_][A-Za-z0-9_.-]*)/)*(?:[A-Za-z0-9_][A-Za-z0-9_.-]*|\.[A-Za-z0-9_][A-Za-z0-9_.-]*)|(?:[A-Za-z0-9_][A-Za-z0-9_.-]*\.[A-Za-z0-9_-]+|\.gitattributes|\.gitignore|\.gitleaks\.toml|LICENSE))":"[a-fA-F0-9]{64}"(?:,"(?:(?:core|connectors|src|router|catalogue|subjects|docs|tests|tools|\.github)/(?:(?:[A-Za-z0-9_][A-Za-z0-9_.-]*|\.[A-Za-z0-9_][A-Za-z0-9_.-]*)/)*(?:[A-Za-z0-9_][A-Za-z0-9_.-]*|\.[A-Za-z0-9_][A-Za-z0-9_.-]*)|(?:[A-Za-z0-9_][A-Za-z0-9_.-]*\.[A-Za-z0-9_-]+|\.gitattributes|\.gitignore|\.gitleaks\.toml|LICENSE))":"[a-fA-F0-9]{64}")*)?\}\}$''',
    '''^\n?SOURCE_HASHES = \{'(?:(?:core|connectors|src|router|catalogue|subjects|docs|tests|tools|\.github)/(?:(?:[A-Za-z0-9_][A-Za-z0-9_.-]*|\.[A-Za-z0-9_][A-Za-z0-9_.-]*)/)*(?:[A-Za-z0-9_][A-Za-z0-9_.-]*|\.[A-Za-z0-9_][A-Za-z0-9_.-]*)|(?:[A-Za-z0-9_][A-Za-z0-9_.-]*\.[A-Za-z0-9_-]+|\.gitattributes|\.gitignore|\.gitleaks\.toml|LICENSE))': '[a-fA-F0-9]{64}'(?:, '(?:(?:core|connectors|src|router|catalogue|subjects|docs|tests|tools|\.github)/(?:(?:[A-Za-z0-9_][A-Za-z0-9_.-]*|\.[A-Za-z0-9_][A-Za-z0-9_.-]*)/)*(?:[A-Za-z0-9_][A-Za-z0-9_.-]*|\.[A-Za-z0-9_][A-Za-z0-9_.-]*)|(?:[A-Za-z0-9_][A-Za-z0-9_.-]*\.[A-Za-z0-9_-]+|\.gitattributes|\.gitignore|\.gitleaks\.toml|LICENSE))': '[a-fA-F0-9]{64}')*\}$''',
    '''^\n?[ \t]*--hash=sha256:[a-f0-9]{64}[ \t]*(?:\\[ \t]*)?$''',
]
