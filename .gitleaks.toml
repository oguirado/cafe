title = "Cafe secret scan"
[extend]
useDefault = true

[[rules]]
id = "cafe-secret-key"
description = "Explicit secret_key assignment with a complete hexadecimal secret"
regex = '''(?i)secret_key\s*[:=]\s*["']?([a-f0-9]{64})(?:["']|\s|$)'''
secretGroup = 1
keywords = ["secret_key"]

[allowlist]
regexTarget = "line"
# Exact metadata line structures; only their SHA-256 digest fields may vary.
# No path/directory exemption; appended credentials invalidate every exception.
# Pinned scanner 8.18.4 includes the preceding newline in non-first line targets.
regexes = [
    '''^\n?SCHEMA_SHA256 = "[a-f0-9]{64}"$''',
    '''^\n?\{"corpus":"cafe","families":\{"architecture-v0-1":"docs/architecture/ARCHITECTURE\.v0\.1\.md","backend-book":"subjects/backend/page\.md","github-repo-rule":"docs/GITHUB_REPO_RULE\.md","js-backend-supervisor":"src/main/backendSupervisor\.js","js-cafe-bridge":"src/preload/cafeBridge\.js","py-authority-channel":"connectors/cafe/authority_channel\.py","py-channel-auth":"connectors/cafe/channel_auth\.py","readme":"docs/acceptance/README\.md","rust-authority-auth":"core/src/authority_auth\.rs","rust-authority-fixture":"core/tests/authority_fixture\.rs","rust-authority-journal":"core/src/authority_journal\.rs","rust-capsule-pairing":"core/src/capsule_pairing\.rs","rust-capsule-registry":"core/src/capsule_registry\.rs","rust-capture-health":"core/src/capture_health\.rs","rust-frame-pool":"core/src/capture_frame_pool\.rs","rust-journal-replay":"core/src/journal_replay\.rs","rust-main":"core/src/main\.rs","rust-python-supervisor":"core/src/python_connector_supervisor\.rs","rust-wgc-producer":"core/src/windows_graphics_capture\.rs","rust-window-registry":"core/src/windows_window_registry\.rs"\},"metadata":\{"Cargo\.toml":"[a-f0-9]{64}","catalogue/ownership\.json":"[a-f0-9]{64}","catalogue/protocol\.json":"[a-f0-9]{64}"\},"node_schema_sha256":"[a-f0-9]{64}","profile_sha256":"[a-f0-9]{64}","schema":"cafe\.router-sources\.v1","sources":\{"connectors/cafe/authority_channel\.py":"[a-f0-9]{64}","connectors/cafe/channel_auth\.py":"[a-f0-9]{64}","core/src/authority_auth\.rs":"[a-f0-9]{64}","core/src/authority_journal\.rs":"[a-f0-9]{64}","core/src/capsule_pairing\.rs":"[a-f0-9]{64}","core/src/capsule_registry\.rs":"[a-f0-9]{64}","core/src/capture_frame_pool\.rs":"[a-f0-9]{64}","core/src/capture_health\.rs":"[a-f0-9]{64}","core/src/journal_replay\.rs":"[a-f0-9]{64}","core/src/main\.rs":"[a-f0-9]{64}","core/src/python_connector_supervisor\.rs":"[a-f0-9]{64}","core/src/windows_graphics_capture\.rs":"[a-f0-9]{64}","core/src/windows_window_registry\.rs":"[a-f0-9]{64}","core/tests/authority_fixture\.rs":"[a-f0-9]{64}","docs/GITHUB_REPO_RULE\.md":"[a-f0-9]{64}","docs/acceptance/README\.md":"[a-f0-9]{64}","docs/architecture/ARCHITECTURE\.v0\.1\.md":"[a-f0-9]{64}","src/main/backendSupervisor\.js":"[a-f0-9]{64}","src/preload/cafeBridge\.js":"[a-f0-9]{64}","subjects/backend/page\.md":"[a-f0-9]{64}"\},"tools":\{"tools/build_cafe_nodes\.py":"[a-f0-9]{64}","tools/cafe_router_common\.py":"[a-f0-9]{64}","tools/extract_js\.py":"[a-f0-9]{64}","tools/extract_py\.py":"[a-f0-9]{64}","tools/extract_rust\.py":"[a-f0-9]{64}","tools/qualify_cafe_router\.py":"[a-f0-9]{64}","tools/resolve_cafe\.py":"[a-f0-9]{64}"\}\}$''',
    '''^\n?SOURCE_HASHES = \{'core/src/authority_journal\.rs': '[a-f0-9]{64}', 'core/src/capsule_registry\.rs': '[a-f0-9]{64}', 'core/src/journal_replay\.rs': '[a-f0-9]{64}', 'core/src/main\.rs': '[a-f0-9]{64}', 'core/src/capsule_pairing\.rs': '[a-f0-9]{64}', 'core/src/windows_window_registry\.rs': '[a-f0-9]{64}', 'core/src/capture_health\.rs': '[a-f0-9]{64}', 'core/src/capture_frame_pool\.rs': '[a-f0-9]{64}', 'core/src/windows_graphics_capture\.rs': '[a-f0-9]{64}'\}$''',
    '''^\n?[ \t]*--hash=sha256:[a-f0-9]{64}[ \t]*(?:\\[ \t]*)?$''',
]
