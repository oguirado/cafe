{
  "name": "Cafe CI",
  "on": [
    "push",
    "pull_request"
  ],
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "verify": {
      "name": "verify (${{ matrix.os }})",
      "runs-on": "${{ matrix.os }}",
      "timeout-minutes": 45,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "os": [
            "ubuntu-latest",
            "windows-latest"
          ]
        }
      },
      "steps": [
        {
          "name": "Checkout complete history",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "fetch-depth": 0
          }
        },
        {
          "name": "Node development runtime",
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "24.14.0"
          }
        },
        {
          "name": "Python development runtime",
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.12.3"
          }
        },
        {
          "name": "Pinned Rust toolchain and Windows standard library",
          "shell": "bash",
          "run": "rustup toolchain install 1.97.0 --profile minimal\nrustup default 1.97.0\nrustup target add x86_64-pc-windows-msvc"
        },
        {
          "name": "Pinned tokenizer CI tooling",
          "run": "python -m pip install --disable-pip-version-check --require-hashes -r requirements-ci.txt"
        },
        {
          "name": "Locked JavaScript checker",
          "run": "npm ci --ignore-scripts"
        },
        {
          "name": "Fetch only locked Rust packages",
          "run": "cargo fetch --locked"
        },
        {
          "id": "gate_rust",
          "name": "Gate rust",
          "run": "python -B tools/run_ci.py --stage rust"
        },
        {
          "id": "gate_python",
          "name": "Gate python",
          "run": "python -B tools/run_ci.py --stage python"
        },
        {
          "id": "gate_node",
          "name": "Gate node",
          "run": "python -B tools/run_ci.py --stage node"
        },
        {
          "id": "gate_checkjs",
          "name": "Gate checkjs",
          "run": "python -B tools/run_ci.py --stage checkjs"
        },
        {
          "id": "gate_integration",
          "name": "Gate integration",
          "run": "python -B tools/run_ci.py --stage integration"
        },
        {
          "id": "gate_router",
          "name": "Gate router",
          "run": "python -B tools/run_ci.py --stage router"
        },
        {
          "id": "gate_publication",
          "name": "Gate publication",
          "run": "python -B tools/run_ci.py --stage publication"
        },
        {
          "id": "gate_claims",
          "name": "Gate claims",
          "run": "python -B tools/run_ci.py --stage claims"
        }
      ]
    },
    "secret-scan": {
      "name": "gitleaks full history and real negative controls",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 15,
      "steps": [
        {
          "name": "Checkout complete history",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "fetch-depth": 0
          }
        },
        {
          "name": "Install exact checksum-verified scanner in CI only",
          "shell": "bash",
          "run": "curl --fail --location --output \"$RUNNER_TEMP/gitleaks_8.18.4_linux_x64.tar.gz\" https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz\nprintf '%s  %s\\n' 'ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d' \"$RUNNER_TEMP/gitleaks_8.18.4_linux_x64.tar.gz\" | sha256sum --check --status\ntar --extract --gzip --file \"$RUNNER_TEMP/gitleaks_8.18.4_linux_x64.tar.gz\" --directory \"$RUNNER_TEMP\" gitleaks\necho \"$RUNNER_TEMP\" >> \"$GITHUB_PATH\"\n"
        },
        {
          "name": "Scan all Git history",
          "run": "gitleaks detect --source . --config .gitleaks.toml --log-opts=--all --redact=100 --no-banner"
        },
        {
          "name": "All three secret controls must be detected",
          "run": "python3 -B tools/secret_scan_controls.py"
        }
      ]
    },
    "wgc-availability": {
      "name": "WGC availability assessment (not native pass)",
      "runs-on": "windows-latest",
      "timeout-minutes": 20,
      "outputs": {
        "status": "${{ steps.probe.outputs.status }}"
      },
      "steps": [
        {
          "name": "Checkout complete history",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "fetch-depth": 0
          }
        },
        {
          "name": "Node development runtime",
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "24.14.0"
          }
        },
        {
          "name": "Python development runtime",
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.12.3"
          }
        },
        {
          "name": "Pinned Rust toolchain and Windows standard library",
          "shell": "bash",
          "run": "rustup toolchain install 1.97.0 --profile minimal\nrustup default 1.97.0\nrustup target add x86_64-pc-windows-msvc"
        },
        {
          "name": "Fetch only locked Rust packages",
          "run": "cargo fetch --locked"
        },
        {
          "name": "Assess real owned-window probe",
          "id": "probe",
          "run": "python -B tools/run_wgc_probe.py --assess"
        }
      ]
    },
    "wgc-synthetic": {
      "name": "Synthetic owned-window WGC capture",
      "needs": [
        "wgc-availability"
      ],
      "if": "needs.wgc-availability.outputs.status == 'pass'",
      "runs-on": "windows-latest",
      "timeout-minutes": 20,
      "steps": [
        {
          "name": "Checkout complete history",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "fetch-depth": 0
          }
        },
        {
          "name": "Node development runtime",
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "24.14.0"
          }
        },
        {
          "name": "Python development runtime",
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.12.3"
          }
        },
        {
          "name": "Pinned Rust toolchain and Windows standard library",
          "shell": "bash",
          "run": "rustup toolchain install 1.97.0 --profile minimal\nrustup default 1.97.0\nrustup target add x86_64-pc-windows-msvc"
        },
        {
          "name": "Fetch only locked Rust packages",
          "run": "cargo fetch --locked"
        },
        {
          "name": "Actual synthetic capture must pass",
          "run": "python -B tools/run_wgc_probe.py"
        }
      ]
    }
  }
}
